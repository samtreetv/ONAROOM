<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ONAROOM</title>
<style>
/* ONAROOM v9 · orbs, no panels, no outlines */
:root{--say:#ffff00;--saysh:2px 2px 0 #000;--ink:#fff;--pix:"Pixelify Sans","Helvetica Neue",Helvetica,Arial,sans-serif;--clean:"Helvetica Neue",Helvetica,Arial,sans-serif;--f:var(--clean);--glow:rgba(20,50,120,.65);color-scheme:light}
body.pixel{--f:var(--pix)}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#8fb4e6;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;touch-action:none}
#c{display:block;width:100%;height:100%}
button,input{outline:none}
.ob{border:0;background:none;padding:0;cursor:pointer;position:relative;display:inline-grid;place-items:center;transition:transform .26s cubic-bezier(.22,1,.36,1),filter .25s,opacity .2s;-webkit-tap-highlight-color:transparent}
.ob:hover{transform:scale(1.08)}.ob:active{transform:scale(.94)}
.ob:focus-visible{filter:drop-shadow(0 0 8px #fff)}
.ob.on,.ob.live{filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px rgba(255,255,255,.7))}
.ob.off{opacity:.55}
.ob .n{position:absolute;right:-4px;top:-4px;font:700 11px var(--pix);color:#ffff00;text-shadow:1px 1px 0 #000}
.say,#solw,#specname,.lact b,#lroom,#full{font:700 15px var(--pix);color:var(--say);text-shadow:var(--saysh);letter-spacing:.03em}
#tip{position:absolute;left:64px;right:64px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;color:#fff;text-shadow:0 1px 8px rgba(20,50,120,.6);font:500 13px/1.4 var(--f);letter-spacing:.04em;transition:opacity 2.5s;pointer-events:none;z-index:20}

/* ---- landing ---- */
#intro{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(60% 50% at 50% 46%,rgba(30,70,150,.32),transparent);transition:opacity .6s}
#intro.out{opacity:0;pointer-events:none}
#land{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;--R:150px}
#hue{position:relative;width:calc(var(--R)*2);height:calc(var(--R)*2);border-radius:50%;cursor:pointer;touch-action:none}
#lknob{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;box-shadow:0 0 0 4px #fff,0 0 18px #fff;pointer-events:none}
#hue::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#ff4d4d,#ffb84d,#fff04d,#6dff4d,#4dffd2,#4db8ff,#6d4dff,#e04dff,#ff4d9a,#ff4d4d);-webkit-mask:radial-gradient(closest-side,transparent 83%,#000 85%,#000 96%,transparent 98%);mask:radial-gradient(closest-side,transparent 83%,#000 85%,#000 96%,transparent 98%);filter:saturate(.9) drop-shadow(0 0 8px rgba(255,255,255,.5))}
#lorb{position:absolute;left:50%;top:var(--R);transform:translate(-50%,-50%);pointer-events:none;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,calc(-50% - 6px))}}
#lmarks{position:absolute;left:50%;top:var(--R);width:0;height:0;pointer-events:none}
.lmark{position:absolute;left:-15px;top:-15px;width:30px;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.lmark b{position:absolute;left:50%;top:32px;transform:translateX(-50%);white-space:nowrap;font:700 12px var(--pix);color:#ffff00;text-shadow:1px 1px 0 #000}
#name{margin-top:4px;width:240px;height:40px;border:0;background:none;color:var(--say);text-shadow:var(--saysh);font:700 20px var(--pix);text-align:center;-webkit-user-select:text;user-select:text}
#name::placeholder{color:rgba(255,255,255,.65);text-shadow:none}
.lacts{display:flex;gap:46px;align-items:flex-end}
.lact{display:flex;flex-direction:column;align-items:center;gap:4px}
.lact b{font-size:13px}
#lroom{margin:0;font-size:12px;color:#fff;opacity:.85}
#full{margin:0}
#burst{position:absolute;inset:0;pointer-events:none;z-index:15}
#clouds{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(40% 30% at 20% 30%,rgba(255,255,255,.95),transparent 70%),radial-gradient(45% 35% at 75% 25%,rgba(255,255,255,.9),transparent 70%),radial-gradient(50% 40% at 55% 70%,rgba(255,255,255,.95),transparent 70%),radial-gradient(35% 30% at 15% 80%,rgba(240,246,255,.9),transparent 70%),rgba(235,243,255,.55);animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{background-position:30px -20px,-40px 10px,20px 30px,-10px -30px,0 0}}
#solar.space{background:radial-gradient(60% 55% at 50% 46%,rgba(8,16,48,.25),transparent 75%)}
#flash{position:absolute;inset:0;background:#fff;pointer-events:none;z-index:16}

/* ---- top left: the sky orb and who is here ---- */
#sky{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));z-index:6}
#sky>.ob{float:left}
#seats{display:flex;align-items:center;gap:7px;height:40px;margin-left:50px;color:#fff;font:600 13px var(--pix)}
#seats i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.3)}
#skyfan{position:absolute;left:46px;top:-4px;display:flex;flex-wrap:wrap;gap:4px;width:min(440px,calc(100vw - 70px))}
#skyfan .ob{animation:fanin .45s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0ms)}
#skyfan .again{margin-left:4px}
@keyframes fanin{from{transform:translateX(-30px) scale(.3);opacity:0}}
#skyhist{clear:both;display:flex;flex-direction:column;gap:3px;padding:6px 0 0 6px}
.shr{display:flex;align-items:center;gap:4px;animation:fanin .4s both}
.shr i{font:700 11px var(--pix);color:#fff;font-style:normal;text-shadow:0 1px 3px #000}

/* ---- top right: the HUD orbs ---- */
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(8px,env(safe-area-inset-right,0px));display:flex;gap:4px;align-items:center;z-index:6}

/* ---- the menu: a solar system over the world ---- */
#solar{position:absolute;inset:0;z-index:12;background:radial-gradient(60% 55% at 50% 46%,rgba(8,16,48,.5),rgba(8,16,48,.15) 70%,transparent);touch-action:none;animation:solin .35s both}
@keyframes solin{from{opacity:0}}
#solc,.sp,#solw{position:absolute;left:0;top:0;will-change:transform}
#solc{z-index:4}
.sp{border:0;background:none;padding:0;cursor:pointer;transition:filter .25s;-webkit-tap-highlight-color:transparent}
.sp.lit{filter:drop-shadow(0 0 10px rgba(255,255,255,.75))}
.sp.live{filter:drop-shadow(0 0 8px #9fe8c8) drop-shadow(0 0 18px #5fe0a8)}
#solw{z-index:8;white-space:nowrap;pointer-events:none;font-size:17px}

/* ---- spectate ---- */
#spec{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 54px);display:flex;justify-content:center;align-items:center;gap:22px;z-index:7;pointer-events:none}
#spec>div{pointer-events:auto}
#specname{min-width:90px;text-align:center}
#specx{position:absolute;right:16px}

#chat{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(520px,calc(100% - 32px));display:flex;gap:8px;z-index:7}
#chat input{flex:1;min-width:0;height:46px;border-radius:23px;border:0;background:rgba(10,24,64,.45);color:var(--say);text-shadow:var(--saysh);padding:0 18px;font:700 16px var(--f);-webkit-user-select:text;user-select:text}
#chat input::placeholder{color:rgba(255,255,255,.6);text-shadow:none;font-weight:400}
#chat button{width:46px;height:46px;border:0;background:none;color:#fff;font:400 22px var(--f);cursor:pointer;text-shadow:0 1px 6px var(--glow)}
#log{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 76px);width:min(360px,calc(100% - 32px));display:flex;flex-direction:column;gap:4px;pointer-events:none;font:600 14px/1.35 var(--f);color:#fff;text-shadow:0 1px 6px rgba(20,50,120,.8)}
#log div{transition:opacity 1.5s}

/* ---- tiles: cams, screens and videos you size yourself (Aspect + Tilt after Bencho, MIT) ---- */
.tile{position:absolute;z-index:4;touch-action:none;perspective:800px;transition:width 520ms cubic-bezier(.22,1,.36,1),height 520ms cubic-bezier(.22,1,.36,1),opacity .35s}
.tile.in{opacity:0}
.tile .tl-card{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:rgba(14,30,72,.35);-webkit-mask-image:radial-gradient(ellipse 74% 74% at 50% 50%,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse 74% 74% at 50% 50%,#000 60%,transparent 100%);transform-style:preserve-3d;cursor:grab}
.tile.solid .tl-card{-webkit-mask-image:none;mask-image:none}
.tile .tl-card video,.tile .tl-card iframe{width:100%;height:100%;object-fit:cover;display:block;border:0;pointer-events:none}
.tile.fit .tl-card video{object-fit:contain}
.tile.self .tl-card video{transform:scaleX(-1)}
.tile.yt .tl-card iframe{pointer-events:auto}
.tile .tl-sheen{position:absolute;inset:0;pointer-events:none}
.tile .tl-bar{position:absolute;left:50%;top:-34px;transform:translateX(-50%);display:flex;gap:3px;align-items:center;opacity:0;transition:opacity .2s;white-space:nowrap}
.tile:hover .tl-bar,.tile.touch .tl-bar{opacity:1}
.tl-bar .asp{display:flex;position:relative;border-radius:14px;background:rgba(10,24,64,.5)}
.tl-bar .asp i{position:absolute;top:0;left:0;width:30px;height:28px;border-radius:14px;background:rgba(255,255,255,.25);transition:transform 290ms cubic-bezier(.22,1,.36,1)}
.tl-bar .asp button{width:30px;height:28px;border:0;background:none;color:#fff;cursor:pointer;padding:0}
.tl-bar .asp button svg{display:block;margin:auto}
.tile .tl-name{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:700 12px var(--pix);color:#ffff00;text-shadow:1px 1px 0 #000;pointer-events:none}
.tile .tl-grip{position:absolute;right:0;bottom:0;width:30px;height:30px;cursor:nwse-resize}
.tile.min{width:44px!important;height:44px!important}
.tile.min .tl-card{border-radius:50%;-webkit-mask-image:none;mask-image:none;box-shadow:0 0 18px rgba(255,255,255,.6)}
.tile.min .tl-name,.tile.min .tl-grip{display:none}

/* ---- a window, up close: the board floats, the tools are orbs ---- */
#wcard{position:absolute;inset:0;display:grid;place-items:center;z-index:11;background:radial-gradient(70% 60% at 50% 50%,rgba(8,16,48,.5),transparent)}
#wcard .wc{position:relative;width:min(940px,calc(100% - 20px))}
#wcard .wp{position:relative;color:#fff;font:400 14px var(--f)}
#wcard .wh{display:flex;align-items:center;gap:6px;margin:0 2px 8px;flex-wrap:wrap}
#wcard .wh b{font:700 17px var(--pix);color:var(--say);text-shadow:var(--saysh);margin-right:auto;letter-spacing:.06em}
#wcard .tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;justify-content:center}
#wcard .tools .ob:disabled{opacity:.3;cursor:default}
#wcard .tools .dots{display:flex;gap:6px;margin:0 6px}
#wcard .tools .dots button{width:22px;height:22px;border:0;border-radius:50%;padding:0;cursor:pointer;opacity:.6;box-shadow:0 0 8px rgba(255,255,255,.45)}
#wcard .tools .dots button.on{opacity:1;box-shadow:0 0 12px #fff,0 0 22px #fff}
#wcard .board{position:relative;width:100%;aspect-ratio:16/10;border-radius:18px;overflow:hidden;touch-action:none;background:#dfe9f8;box-shadow:0 24px 60px -12px rgba(8,16,48,.6)}
#wcard .board canvas{position:absolute;inset:0;width:100%;height:100%}
#wcard .board iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#wcard .lock{font:700 14px var(--pix);color:var(--say);text-shadow:var(--saysh)}
#wcard .ask{display:flex;gap:8px;margin-top:10px;align-items:center}
#wcard .ask input{flex:1;min-width:0;height:42px;border-radius:21px;border:0;background:rgba(10,24,64,.45);color:#fff;padding:0 16px;font:600 15px var(--f);-webkit-user-select:text;user-select:text}
#wcard .ask input.say{color:var(--say);text-shadow:var(--saysh);font-weight:700}

#follow{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;z-index:7;white-space:nowrap}
#follow span{font:700 14px var(--pix);color:var(--say);text-shadow:var(--saysh)}
@media (max-width:470px){#follow{top:calc(env(safe-area-inset-top,0px) + 100px)}#follow span{font-size:12px}.lacts{gap:28px}}
@media (prefers-reduced-motion:reduce){#tip{transition:none}.tile,.ob,#lorb,#skyfan .ob,.shr{transition:none!important;animation:none!important}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Noto+Emoji:wght@700&display=swap" rel="stylesheet"><style>
#arch{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:9}
.arow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.acap{font:700 15px var(--pix);color:var(--say);text-shadow:var(--saysh)}
.roll{display:flex;height:1em;overflow:hidden;font:700 34px/1 var(--pix);color:var(--say);text-shadow:var(--saysh);padding:0 4px}
.rcol{display:flex;flex-direction:column;align-self:flex-start;transition:transform .45s cubic-bezier(.22,1.4,.36,1)}
.rcol i{font-style:normal;height:1em;line-height:1em;display:block;flex:none;text-align:center;min-width:.62em}
#arch .go{margin-left:18px}
/* v17: the landing — arrows instead of the colour ring, twelve colour dots, the orb drawn live */
#hue::before,#lknob{display:none}
#hue{cursor:default}
#lorbgl{display:block;will-change:transform}
#larr,#ldots{position:absolute;left:50%;top:var(--R);width:0;height:0}
#larr .larr{position:absolute;top:-29px;width:58px;height:58px;padding:0;border:0;background:none;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
#larr .larr.l{left:calc(var(--R) * -1.08 - 29px)}
#larr .larr.r{left:calc(var(--R) * 1.08 - 29px)}
#larr .larr:hover{transform:scale(1.1)}
#larr .larr:active{transform:scale(.9)}
#ldots i{position:absolute;top:calc(var(--R) * .86);width:7px;height:7px;margin:-3.5px;border-radius:50%;opacity:.4;transition:all .25s}
#ldots i.on{width:12px;height:12px;margin:-6px;opacity:1;box-shadow:0 0 12px currentColor}
.lmark{left:-13px;top:-13px;width:26px}
.lmark b{top:28px}
/* v17: the volume page */
#volp{position:absolute;left:50%;top:max(138px,calc(11vh + 70px));transform:translateX(-50%);display:flex;flex-direction:column;gap:4px;width:min(460px,94vw);max-height:calc(100vh - 170px);overflow-y:auto;scrollbar-width:none;padding:4px 10px 18px}
#volp::-webkit-scrollbar{display:none}
.vrow{display:grid;grid-template-columns:50px 1fr 132px;align-items:center;gap:10px;min-height:52px}
.vrow .ob{width:50px;height:50px;padding:0;border:0;background:none;cursor:pointer}
.vt{position:relative;height:36px;cursor:pointer;touch-action:none}
.vt::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.22))}
.vf{position:absolute;left:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--c));box-shadow:0 0 12px var(--c);transition:width .08s}
.vk{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;transition:left .08s}
.vt.tog{max-width:64px}
.vt.tog .vf,.vt.tog .vk{transition:all .25s cubic-bezier(.3,1.5,.5,1)}
.vw{font:700 13px var(--pix);color:#ffff00;text-shadow:1px 1px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow.off .vw{color:#b9b9b9}
.vrow.off .vk{filter:saturate(.2) brightness(.7)}
@media (max-width:520px){.vrow{grid-template-columns:44px 1fr 104px}.vrow .ob{width:44px;height:44px}.vw{font-size:11px}}
/* v18: the landing — 24 orbs floating between two words */
#lgl{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#intro{background:radial-gradient(70% 55% at 50% 50%,rgba(20,50,120,.28),transparent)}
#hue,#larr,#ldots,#lmarks,.lacts:not(#host),#lroom{display:none!important}
#lorb{position:fixed!important;left:50%;top:50%;width:10px;height:10px;transform:translate(-50%,-50%);animation:none!important;visibility:hidden;pointer-events:none}
.lt{position:absolute;left:50%;transform:translateX(-50%);border:0;background:none;padding:6px 14px;cursor:pointer;white-space:nowrap;font:700 clamp(26px,8.4vw,68px)/1 var(--pix);color:#ffff00;text-shadow:3px 3px 0 #000;letter-spacing:.02em;transition:opacity .35s,transform .2s;z-index:2}
#lt1{top:max(calc(env(safe-area-inset-top,0px) + 4vh),24px)}
#lt2{font-size:clamp(22px,6.8vw,60px)!important;bottom:max(calc(env(safe-area-inset-bottom,0px) + 5vh),28px)}
.lt:hover{transform:translateX(-50%) scale(1.04)}
.lt:active{transform:translateX(-50%) scale(.97)}
.lt.dim{opacity:.28}
#intro.named .lt{opacity:.22}
#land{position:absolute!important;left:50%;top:auto;bottom:max(calc(env(safe-area-inset-bottom,0px) + 15vh),110px);transform:translateX(-50%);flex-direction:row!important;gap:10px!important;opacity:0;pointer-events:none;transition:opacity .3s;z-index:3}
#intro.named #land,#land:has(#host:not([hidden])){opacity:1;pointer-events:auto}
#land #name{font-size:clamp(20px,5.6vw,34px);width:min(50vw,320px);height:52px}
#host{flex-direction:row}
#lgob .ob{width:56px;height:56px;padding:0;border:0;background:none;cursor:pointer}
/* v19: pick your orb — the others orbit; arrows, your name above, the name line below */
.larrow{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;padding:0;border:0;background:none;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s,transform .18s cubic-bezier(.3,1.6,.5,1);z-index:3}
#intro.named .larrow{opacity:1;pointer-events:auto}
.larrow:hover{transform:translate(-50%,-50%) scale(1.1)}
.larrow:active{transform:translate(-50%,-50%) scale(.9)}
#ltop{position:absolute;transform:translate(-50%,-100%);font:700 clamp(22px,6vw,34px)/1 var(--pix);text-shadow:2px 2px 0 #000;white-space:nowrap;pointer-events:none;z-index:3;opacity:0;transition:opacity .3s}
#intro.named #ltop{opacity:1}
#land{bottom:auto!important;align-items:center!important}
#laa{width:46px;height:46px;padding:0;border:0;background:none;cursor:pointer}
#land #name{color:#ffff00;text-shadow:2px 2px 0 #000}
/* v20: a calm load-in */
#boot{position:fixed;inset:0;z-index:100;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,#8db8ff,#5d8fe8 55%,#3d64c4);transition:opacity .8s ease}
#boot.gone{opacity:0}
#lgl{image-rendering:pixelated;opacity:0;animation:lglIn .9s ease .25s forwards}
#lgl.sharp{image-rendering:auto}
@keyframes lglIn{to{opacity:1}}
.lt{opacity:0;animation:lglIn .9s ease .45s forwards}
#intro.named .lt{animation:none;opacity:.22}
.lt.dim{animation:none}
/* v21: making a room — the orb picker steps aside so the room shows */
#intro.setup .larrow{opacity:0!important;pointer-events:none!important}
#intro.arch{background:none!important;pointer-events:none}
#intro.arch #lgl,#intro.arch #ltop,#intro.arch .lt,#intro.arch .larrow{opacity:0!important;pointer-events:none!important;transition:opacity .35s}
</style>
</head>
<body class="pixel">
<div id="stage">
  <canvas id="c" role="img" aria-label="A mirror floor under a bright blue sky, a ring of 9 windows, and up to four glowing orbs"></canvas>
  <div id="intro">
    <button id="lt1" class="lt" type="button">enter lobby</button>
    <button id="lt2" class="lt" type="button">create your own room</button>
    <div id="land">
      <div id="hue" role="slider" aria-label="Your orb's colour"><div id="lknob"></div></div>
      <div id="lorb"></div>
      <div id="larr"></div>
      <div id="ldots"></div>
      <div id="lmarks"></div>
      <input id="name" maxlength="18" placeholder="your name" autocomplete="off" enterkeyhint="go" aria-label="Your name">
      <div id="lgob"></div>
      <div class="lacts"><div id="go" class="lact"></div><div id="fresh" class="lact"></div></div>
      <div id="host" class="lacts" hidden></div>
      <p id="full" hidden>4 of 4 · this room is full</p>
      <p id="lroom"></p>
    </div>
  </div>
  <div id="arch" class="ui" hidden></div>
  <canvas id="burst" hidden></canvas>
  <div id="flash" hidden></div>
  <div id="clouds" hidden></div>
  <div id="sky" class="ui" hidden><button id="skyorb" type="button" class="ob" aria-label="The sky (G)"></button><div id="seats" aria-label="Who is here"><i></i><i></i><i></i><i></i><b id="count" hidden></b></div><div id="skyfan" hidden></div><div id="skyhist"></div></div>
